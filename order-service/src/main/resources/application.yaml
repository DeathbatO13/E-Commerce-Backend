server:
  port: 8084

spring:
  application:
    name: order-service

  profiles:
    active: dev

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

security:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKey12345678901234567890123456789012}
  # Token compartido con payment-service para POST /orders/{id}/pay (mismo valor en ambos servicios)
  internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-change-me}

logging:
  level:
    root: INFO
