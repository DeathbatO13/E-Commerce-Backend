server:
  port: ${PORT:8084}

spring:
  application:
    name: order-service

  profiles:
    active: dev

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

security:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKey12345678901234567890123456789012}
  # Token compartido con payment-service para POST /orders/{id}/pay (mismo valor en ambos servicios)
  internal-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token-change-me}

cart:
  service:
    url: ${CART_SERVICE_URL:http://localhost:8083}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Orígenes del frontend, separados por coma (ver CorsConfig)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5001,http://localhost:5173}
