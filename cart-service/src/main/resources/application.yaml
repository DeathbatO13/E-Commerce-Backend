spring:
  application:
    name: cart-service

  profiles:
    active: dev

  jpa:
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8083}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}

security:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKey12345678901234567890123456789012}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Orígenes del frontend, separados por coma (ver CorsConfig)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5001,http://localhost:5173}
