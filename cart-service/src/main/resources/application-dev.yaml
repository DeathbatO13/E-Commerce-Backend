spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cart_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      # El esquema lo crea Flyway (db/migration); Hibernate solo verifica que coincida
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

