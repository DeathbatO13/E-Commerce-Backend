openapi: 3.0.3
info:
  title: Payment Service API (Mock)
  description: Servicio de pagos simulado para el MVP.
  version: 1.0.0

servers:
  - url: http://localhost:8085
    description: Payment Service (local)

tags:
  - name: Payments
    description: Procesamiento de pagos (mock)

paths:
  /payments/process:
    post:
      tags: [Payments]
      summary: Procesar pago simulado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Pago procesado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PaymentRequest:
      type: object
      required: [orderId, amount]
      properties:
        orderId:
          type: string
        amount:
          type: number

    PaymentResponse:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [APPROVED, REJECTED]
        transactionId:
          type: string
