openapi: 3.0.3
info:
  title: Catalog Service API
  description: |
    Productos y categorías.

    - Los `GET` son **públicos** (no necesitan token).
    - Crear, modificar y borrar requiere un JWT con rol **ADMIN** o **SUPER_ADMIN**.
      Sin token responde **401 sin cuerpo**; con otro rol, **403**.
    - Borrar es lógico (`active = false`): los productos y categorías inactivos dejan de aparecer
      en los listados y en `GET /products/{id}`.
  version: 2.0.0

servers:
  - url: http://localhost:8082
    description: Catalog Service (local)

tags:
  - name: Categories
  - name: Products

paths:
  /categories:
    get:
      tags: [Categories]
      summary: Listar categorías activas
      responses:
        '200':
          description: Categorías activas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
    post:
      tags: [Categories]
      summary: Crear categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe una categoría activa con ese nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Categories]
      summary: Renombrar categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categories]
      summary: Desactivar categoría
      description: No se puede desactivar una categoría que tiene productos activos.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Categoría desactivada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La categoría tiene productos activos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products:
    get:
      tags: [Products]
      summary: Listar productos activos
      description: |
        Sin filtros devuelve todos los productos activos. Si se envían los dos filtros,
        `categoryId` tiene prioridad y `name` se ignora.
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          required: false
          description: Búsqueda parcial, sin distinguir mayúsculas
          schema:
            type: string
            example: tv
      responses:
        '200':
          description: Productos activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
    post:
      tags: [Products]
      summary: Crear producto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La categoría no existe o está inactiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      summary: Obtener producto
      description: cart-service y order-service usan este endpoint para tomar el precio vigente.
      responses:
        '200':
          description: Producto activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Modificar producto
      description: Reemplaza todos los campos. No crea el producto si no existe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El producto o la categoría no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Products]
      summary: Desactivar producto
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Producto desactivado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Datos inválidos (validación, JSON mal formado o UUID inválido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Falta el token o es inválido / vencido (sin cuerpo)
    Forbidden:
      description: El token no tiene rol ADMIN ni SUPER_ADMIN
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No existe o está inactivo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Electrónica

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        active:
          type: boolean

    CreateProductRequest:
      type: object
      required: [name, description, price, categoryId]
      properties:
        name:
          type: string
          example: TV LCD 55"
        description:
          type: string
          example: Smart TV 4K
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 899.90
        stock:
          type: integer
          minimum: 0
          example: 10
        categoryId:
          type: string
          format: uuid

    UpdateProductRequest:
      allOf:
        - $ref: '#/components/schemas/CreateProductRequest'
        - type: object
          properties:
            active:
              type: boolean
              description: Si se omite, el producto queda inactivo

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        categoryId:
          type: string
          format: uuid
        active:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Product not found
        timestamp:
          type: string
          format: date-time
