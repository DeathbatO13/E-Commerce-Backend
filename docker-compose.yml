# Stack completo en local: Postgres + los 5 microservicios con el perfil prod.
# Uso: cp .env.example .env  (y cambiar los secretos)  →  docker compose up --build
#
# Una sola instancia de Postgres con una base por servicio (docker/postgres/init-databases.sql):
# cada servicio sigue teniendo su propia base y solo conoce la suya.

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

x-depends-on-db: &depends-on-db
  postgres:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 5433 en el host para no chocar con un Postgres local en 5432
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    depends_on: *depends-on-db
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8081:8081"

  catalog-service:
    build: ./catalog-service
    depends_on: *depends-on-db
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
    ports:
      - "8082:8082"

  cart-service:
    build: ./cart-service
    depends_on: *depends-on-db
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart_db
      CATALOG_SERVICE_URL: http://catalog-service:8082
    ports:
      - "8083:8083"

  order-service:
    build: ./order-service
    depends_on: *depends-on-db
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CART_SERVICE_URL: http://cart-service:8083
      CATALOG_SERVICE_URL: http://catalog-service:8082
    ports:
      - "8084:8084"

  payment-service:
    build: ./payment-service
    depends_on: *depends-on-db
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      ORDER_SERVICE_URL: http://order-service:8084
    ports:
      - "8085:8085"

volumes:
  pg_data:
