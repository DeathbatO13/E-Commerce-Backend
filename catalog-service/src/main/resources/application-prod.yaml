# Perfil de producción (Render): SPRING_PROFILES_ACTIVE=prod.
# Sin valores por defecto para los secretos: si falta una variable, el servicio no arranca.
spring:
  datasource:
    # docker-compose pasa SPRING_DATASOURCE_URL completa. Render no puede (su connectionString no es
    # JDBC), así que el blueprint pasa las partes y la URL se arma acá.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:public}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  # Con DB_SCHEMA varios servicios comparten una base (plan free de Render) con un esquema cada uno
  flyway:
    schemas: ${DB_SCHEMA:public}
  jpa:
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
    hibernate:
      ddl-auto: validate

security:
  jwt:
    secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
