server:
  port: ${PORT:8082}

spring:
  application:
    name: catalog_service
  profiles:
    active: dev

springdoc:
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKey12345678901234567890123456789012}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Orígenes del frontend, separados por coma (ver CorsConfig)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5001,http://localhost:5173}
