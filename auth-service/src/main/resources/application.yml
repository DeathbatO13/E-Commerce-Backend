spring:
  application:
    name: auth-service
  profiles:
    active: dev
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    show-sql: true

server:
  port: 8081

security:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKey12345678901234567890123456789012}
    expiration: ${JWT_EXPIRATION:86400000}